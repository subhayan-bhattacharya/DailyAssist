[project]
name = "language-learning"
version = "0.1.0"
description = "German flashcard app backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
    "fastapi>=0.115.0",
    "mangum>=0.19.0",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
